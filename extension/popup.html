<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Privacy Browser Agent</title>

    <style>
        body {
            width: 320px;
            padding: 16px;
            font-family: Arial, sans-serif;
        }

        h3 {
            margin-top: 0;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            min-height: 90px;
            padding: 8px;
            margin-bottom: 10px;
            resize: vertical;
            font-family: Arial, sans-serif;
        }

        button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 11px;
            max-height: 300px;
            overflow: auto;
            margin-top: 12px;
        }
    </style>
</head>

<body>
    <h3>Privacy Browser Agent</h3>

    <textarea
        id="task"
        placeholder="Enter your browser task..."
    ></textarea>

    <button id="inspect">
        Run Agent
    </button>

    <pre id="output"></pre>

    <script src="popup.js"></script>
</body>
</html>
